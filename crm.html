<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CRM - Управление бизнесом</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --sidebar-bg: #ffffff;
            --primary: #1e3a2f;
            --primary-light: #2F5B43;
            --accent: #3b82f6;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        /* --- Sidebar --- */
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; position: fixed; height: 100%; left: 0; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 700; color: var(--primary); margin-bottom: 32px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .logo span { color: var(--primary-light); }
        .menu-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; margin-top: 24px; font-weight: 600; }
        .menu-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500; transition: all 0.2s; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .menu-item:hover { background: #f1f5f9; color: var(--text-main); }
        .menu-item.active { background: #e8f0ec; color: var(--primary-light); font-weight: 600; }
        .menu-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* --- Main Content --- */
        .main-content { flex: 1; margin-left: 260px; padding: 32px 40px; max-width: 1400px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { font-size: 24px; font-weight: 600; color: var(--text-main); letter-spacing: -0.5px; }
        .header-actions { display: flex; gap: 12px; }

        /* --- Buttons --- */
        .btn { padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-icon { padding: 6px; border-radius: 6px; background: #f1f5f9; color: #475569; }
        .btn-icon:hover { background: #e2e8f0; color: var(--primary); }

        /* --- Dashboard Stats --- */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
        .stat-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--text-main); letter-spacing: -1px; }

        /* --- Kanban Board --- */
        .kanban-board { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; min-height: 60vh; }
        .kanban-col { flex: 1; min-width: 300px; background: #f1f5f9; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .col-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: #475569; font-size: 14px; margin-bottom: 8px; }
        .col-count { background: #e2e8f0; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        
        .kanban-card { background: white; border-radius: 8px; padding: 16px; border: 1px solid var(--border); box-shadow: var(--card-shadow); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .kanban-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .kanban-card.reminder { border-left: 4px solid var(--danger); }
        
        .k-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: var(--text-main); }
        .k-phone { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
        .k-desc { font-size: 12px; color: #64748b; margin-bottom: 12px; background: #f8fafc; padding: 8px; border-radius: 4px; }
        .k-footer { display: flex; justify-content: space-between; align-items: center; }
        .k-actions { display: flex; gap: 6px; }

        /* --- Modal --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 28px; border-radius: 16px; width: 90%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-content h2 { font-size: 20px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }

        /* Auth */
        #auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; text-align: center; }
        #crm-container { display: none; width: 100%; }

        /* --- Responsive --- */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .kanban-board { flex-direction: column; }
            .kanban-col { min-width: 100%; }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; padding-bottom: 72px; }
            .sidebar { width: 100%; height: 64px; flex-direction: row; bottom: 0; top: auto; padding: 0 16px; border-right: none; border-top: 1px solid var(--border); justify-content: space-around; align-items: center; }
            .logo, .menu-label { display: none; }
            .menu-item { flex-direction: column; font-size: 10px; gap: 4px; padding: 8px; margin: 0; }
            .menu-item.active { background: none; color: var(--primary-light); }
            .menu-item svg { width: 22px; height: 22px; }
            .main-content { margin-left: 0; padding: 20px 16px; }
            .header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .header-actions { width: 100%; }
            .btn { flex: 1; justify-content: center; }
            .stats-grid { gap: 12px; }
            .stat-card { padding: 16px; }
            .stat-value { font-size: 22px; }
        }
    </style>
</head>
<body>
    <!-- Auth -->
    <div id="auth-container">
        <h2 style="color: var(--primary); margin-bottom: 8px; font-weight: 700;">AI CRM</h2>
        <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 14px;">Войдите, чтобы управлять бизнесом</p>
        <div id="telegram-login-btn">
            <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="vadim602_bot" data-size="large" data-onauth="onTelegramAuth(user)" data-request-access="write"></script>
        </div>
    </div>

    <!-- CRM -->
    <div id="crm-container">
        <div class="sidebar">
            <div class="logo">AI <span>CRM</span></div>
            
            <div class="menu-label">Рабочее пространство</div>
            <div class="menu-item active" onclick="switchTab('kanban')">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                Воронка
            </div>
            <div class="menu-item" onclick="switchTab('list')">
                <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                Список заявок
            </div>

            <div class="menu-label">Настройки</div>
            <div class="menu-item" onclick="switchTab('settings')">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Настройки
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 id="page-title">Воронка продаж</h1>
                <div class="header-actions" id="header-buttons">
                    <button class="btn btn-outline" onclick="exportToExcel()">Экспорт</button>
                    <button class="btn btn-primary" onclick="openCreateClientModal()">+ Клиент</button>
                </div>
            </div>

            <div class="stats-grid" id="stats-block">
                <div class="stat-card">
                    <div class="stat-title">Всего лидов</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Новые</div>
                    <div class="stat-value" id="stat-new" style="color: #1d4ed8;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">В работе</div>
                    <div class="stat-value" id="stat-progress" style="color: #b45309;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Успешно</div>
                    <div class="stat-value" id="stat-closed" style="color: #15803d;">0</div>
                </div>
            </div>

            <!-- Kanban View -->
            <div id="kanban-view" class="kanban-board">
                <!-- Колонки будут рендериться тут -->
            </div>

            <!-- List View (Скрыт по умолчанию) -->
            <div id="list-view" style="display: none;">
                <div class="table-container" style="background:white; border-radius:12px; border:1px solid var(--border);">
                    <table style="width:100%; border-collapse:collapse;">
                        <thead>
                            <tr style="background:#f8fafc; border-bottom:1px solid var(--border);">
                                <th style="padding:12px 20px; text-align:left; font-size:12px; color:#64748b;">ID</th>
                                <th style="padding:12px 20px; text-align:left; font-size:12px; color:#64748b;">Клиент</th>
                                <th style="padding:12px 20px; text-align:left; font-size:12px; color:#64748b;">Телефон</th>
                                <th style="padding:12px 20px; text-align:left; font-size:12px; color:#64748b;">Статус</th>
                                <th style="padding:12px 20px; text-align:left; font-size:12px; color:#64748b;">Действие</th>
                            </tr>
                        </thead>
                        <tbody id="leadsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="clientModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Новая запись</h2>
            <div class="form-group">
                <label>ID клиента (латиницей)</label>
                <input type="text" id="newClientId" placeholder="salon1">
            </div>
            <div class="form-group">
                <label>Название бизнеса</label>
                <input type="text" id="newBusinessName" placeholder="Салон красоты">
            </div>
            <div class="form-group">
                <label>Ссылка на сайт</label>
                <input type="text" id="newSiteUrl" placeholder="https://...">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
                <button class="btn btn-outline" onclick="closeCreateClientModal()">Отмена</button>
                <button class="btn btn-primary" onclick="submitNewClient()">Создать</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ozutjnwextahorvzdbpl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96dXRqbndleHRhaG9ydnpkYnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTQ3MzUsImV4cCI6MjEwNzE5MDczNX0.8L3adhQ9gUR5iSly1afSQN6HeEhkj9QQ4NtUyZUQx28';
        const ADMIN_TELEGRAM_ID = 5818548555; 
        let allLeads = [];

        // AUTH
        function onTelegramAuth(user) {
            fetch('/auth/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) window.location.href = `/crm?auth_success=1&telegram_id=${data.telegram_id}`;
            });
        }

        function checkAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            let tgId = null;

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
                tgId = window.Telegram.WebApp.initDataUnsafe.user.id;
                document.getElementById('telegram-login-btn').style.display = 'none';
            } else if (urlParams.get('auth_success') === '1') {
                tgId = Number(urlParams.get('telegram_id'));
            }

            if (tgId) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('crm-container').style.display = 'flex';
                if (tgId !== ADMIN_TELEGRAM_ID) {
                    document.querySelector('.logo').innerHTML = 'AI <span>Кабинет</span>';
                    document.getElementById('header-buttons').style.display = 'none';
                }
                loadLeads(tgId);
                window.history.replaceState({}, document.title, "/crm");
            }
        }
        window.onload = checkAuth;

        // LOAD
        async function loadLeads(currentTgId = ADMIN_TELEGRAM_ID) {
            try {
                let url = `${SUPABASE_URL}/rest/v1/leads?select=*&order=id.desc`;
                if (currentTgId !== ADMIN_TELEGRAM_ID) url += `&client_id=eq.demo-client`; 

                const res = await fetch(url, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const data = await res.json();
                allLeads = data; 
                
                renderKanban(data);
                renderList(data);
                updateStats(data);
            } catch (e) { console.error(e); }
        }

        // RENDER KANBAN
        function renderKanban(data) {
            const board = document.getElementById('kanban-view');
            board.innerHTML = '';

            const columns = [
                { id: 'new', title: '🆕 Новые', color: '#1d4ed8' },
                { id: 'in_progress', title: '🔄 В работе', color: '#b45309' },
                { id: 'closed', title: '✅ Успешно', color: '#15803d' }
            ];

            columns.forEach(col => {
                const colLeads = data.filter(l => l.status === col.id);
                
                const colEl = document.createElement('div');
                colEl.className = 'kanban-col';
                colEl.innerHTML = `
                    <div class="col-header">
                        <span>${col.title}</span>
                        <span class="col-count">${colLeads.length}</span>
                    </div>
                `;

                colLeads.forEach(lead => {
                    let actionsHtml = '';
                    if (lead.status === 'new') {
                        actionsHtml = `<button class="btn btn-outline" style="font-size:11px; padding:4px 8px;" onclick="changeStatus(${lead.id}, '${lead.status}')">В работу →</button>`;
                    } else if (lead.status === 'in_progress') {
                        actionsHtml = `<button class="btn btn-outline" style="font-size:11px; padding:4px 8px;" onclick="changeStatus(${lead.id}, '${lead.status}')">Закрыть ✅</button>`;
                    } else {
                        actionsHtml = `<button class="btn btn-outline" style="font-size:11px; padding:4px 8px;" onclick="changeStatus(${lead.id}, '${lead.status}')">Вернуть</button>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'kanban-card';
                    card.innerHTML = `
                        <div class="k-title">${lead.name || 'Без имени'}</div>
                        <div class="k-phone">📞 ${lead.phone || '—'}</div>
                        <div class="k-desc">${lead.problem || 'Нет описания'}</div>
                        <div class="k-footer">
                            <div style="font-size:11px; color:#94a3b8;">#${lead.id}</div>
                            ${actionsHtml}
                        </div>
                    `;
                    colEl.appendChild(card);
                });

                board.appendChild(colEl);
            });
        }

        // RENDER LIST
        function renderList(data) {
            const tbody = document.getElementById('leadsBody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#94a3b8;">Нет данных</td></tr>';
                return;
            }
            data.forEach(lead => {
                const statusMap = { 'new': 'Новая', 'in_progress': 'В работе', 'closed': 'Закрыта' };
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border)';
                tr.innerHTML = `
                    <td style="padding:12px 20px; font-size:13px; color:#94a3b8;">#${lead.id}</td>
                    <td style="padding:12px 20px; font-weight:600;">${lead.name || '—'}</td>
                    <td style="padding:12px 20px; color:#64748b;">${lead.phone || '—'}</td>
                    <td style="padding:12px 20px;">${statusMap[lead.status]}</td>
                    <td style="padding:12px 20px;"><button class="btn btn-outline" onclick="changeStatus(${lead.id}, '${lead.status}')">Далее</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats(data) {
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-new').innerText = data.filter(l => l.status === 'new').length;
            document.getElementById('stat-progress').innerText = data.filter(l => l.status === 'in_progress').length;
            document.getElementById('stat-closed').innerText = data.filter(l => l.status === 'closed').length;
        }

        // ACTIONS
        async function changeStatus(leadId, currentStatus) {
            let newStatus = currentStatus === 'new' ? 'in_progress' : (currentStatus === 'in_progress' ? 'closed' : 'new');
            await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
            loadLeads(tgUser ? tgUser.id : ADMIN_TELEGRAM_ID);
        }

        function switchTab(tab) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            if (tab === 'kanban') {
                document.querySelectorAll('.menu-item')[0].classList.add('active');
                document.getElementById('page-title').innerText = 'Воронка продаж';
                document.getElementById('kanban-view').style.display = 'flex';
                document.getElementById('list-view').style.display = 'none';
            } else if (tab === 'list') {
                document.querySelectorAll('.menu-item')[1].classList.add('active');
                document.getElementById('page-title').innerText = 'Список заявок';
                document.getElementById('kanban-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
            } else {
                document.getElementById('page-title').innerText = 'В разработке';
                document.getElementById('kanban-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'none';
            }
        }

        function exportToExcel() {
            if (allLeads.length === 0) return alert('Нет данных');
            const ws_data = [["ID", "Дата", "Имя", "Телефон", "Задача", "Статус"]];
            allLeads.forEach(lead => {
                ws_data.push([lead.id, new Date(lead.created_at).toLocaleString('ru-RU'), lead.name || '', lead.phone || '', lead.problem || '', lead.status]);
            });
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Заявки");
            XLSX.writeFile(wb, "leads_export.xlsx");
        }

        // MODAL
        function openCreateClientModal() { document.getElementById('clientModal').style.display = 'flex'; }
        function closeCreateClientModal() { document.getElementById('clientModal').style.display = 'none'; }

        async function submitNewClient() {
            const client_id = document.getElementById('newClientId').value.trim();
            const business_name = document.getElementById('newBusinessName').value.trim();
            const site_url = document.getElementById('newSiteUrl').value.trim();
            if (!client_id || !business_name || !site_url) return alert('Заполните все поля!');

            const res = await fetch('/api/create-client', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id, business_name, site_url, timezone: 'Europe/Moscow', manager_chat_id: ADMIN_TELEGRAM_ID.toString() })
            });
            const data = await res.json();
            if (data.ok) {
                alert('🚀 Задача запущена!');
                closeCreateClientModal();
            } else {
                alert('Ошибка: ' + data.error);
            }
        }
    </script>
</body>
</html>
