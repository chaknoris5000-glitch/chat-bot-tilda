    <script>
        const ADMIN_TELEGRAM_ID = 5818548555; 
        const MY_BOT_CLIENT_ID = 'tilda'; // ID этого бота
        const tg = window.Telegram.WebApp;
        tg.expand();

        const TARIFFS = {
            'start': { name: 'Старт', month: 1990, year: 17900, monthIfYear: 1490, limit: 100, features: ['До 100 заявок', 'Работает 24/7', 'Уведомления', 'CRM', 'Обучение', 'Отчеты Excel', 'API'] },
            'business': { name: 'Бизнес', month: 2490, year: 23900, monthIfYear: 1990, limit: 300, features: ['До 300 заявок', 'Работает 24/7', 'CRM', 'Обучение', 'Отчеты Excel', 'API'] },
            'unlimited': { name: 'Безлимит', month: 4990, year: 47900, monthIfYear: 3990, limit: 99999, features: ['Безлимит заявок', 'Работает 24/7', 'Приоритетная поддержка', 'CRM', 'Обучение', 'Отчеты Excel', 'API'] },
            'result': { name: 'За результат', month: 25, year: 0, monthIfYear: 25, limit: 99999, features: ['Оплата за заявки (25 ₽)', 'Работает 24/7', 'Прозрачный отчет', 'CRM', 'Обучение', 'Отчеты Excel', 'API'] }
        };
        
        let myClient = null;
        let myLeads = []; 
        let currentPlanKey = null;
        let filterTime = 'today'; 
        let filterStatus = 'all';

        function scrollToPage(index) {
            const container = document.getElementById('swipeContainer');
            container.scrollTo({ left: index * window.innerWidth, behavior: 'smooth' });
        }

        document.getElementById('swipeContainer').addEventListener('scroll', () => {
            const container = document.getElementById('swipeContainer');
            const scrollLeft = container.scrollLeft;
            const width = window.innerWidth;
            if (scrollLeft < width / 2) {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.remove('active');
            } else {
                document.querySelectorAll('.nav-item')[0].classList.remove('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            }
        });

        async function init() {
            const user = tg.initDataUnsafe?.user;
            if (!user) return;
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
            
            try {
                if (user.id === ADMIN_TELEGRAM_ID) {
                    // Админ видит только свои лиды из Tilda
                    myClient = { client_id: 'tilda', business_name: 'AI-Администратор', paid_until: '2099-12-31' };
                    const resLeads = await fetch(`/api/get-leads?telegram_id=${user.id}&client_id=tilda`);
                    myLeads = await resLeads.json();
                    if (!Array.isArray(myLeads)) myLeads = [];
                    setupAdminUI();
                } else {
                    // Обычный клиент
                    const resClient = await fetch(`/api/get-my-client?owner_telegram_id=${user.id}`);
                    myClient = await resClient.json();
                    
                    // ПРОВЕРКА: Если клиент зашел в ЧУЖОЙ бот — не показываем ничего
                    if (!myClient || myClient.client_id !== MY_BOT_CLIENT_ID) {
                        myLeads = [];
                        // Показываем пустой интерфейс
                        document.getElementById('acc-plan-name').innerText = 'Гость';
                        document.getElementById('acc-status').innerText = 'Нет доступа';
                        document.getElementById('acc-date').innerText = '—';
                        document.getElementById('acc-total-leads').innerText = '0';
                        document.getElementById('acc-limit-text').innerText = '0 / 0';
                        document.getElementById('acc-progress').style.width = '0%';
                        renderLeads();
                        renderPlans();
                        return;
                    }

                    if (myClient) {
                        const resLeads = await fetch(`/api/get-leads?telegram_id=${user.id}&client_id=${myClient.client_id}`);
                        myLeads = await resLeads.json();
                        if (!Array.isArray(myLeads)) myLeads = [];
                        setupClientUI(myClient);
                    }
                }
                renderPlans();
            } catch (e) { console.error(e); }
        }

        function setupClientUI(client) {
            const paidUntil = new Date(client.paid_until);
            document.getElementById('acc-plan-name').innerText = client.business_name || 'Бизнес';
            document.getElementById('acc-date').innerText = paidUntil.toLocaleDateString('ru-RU');
            document.getElementById('acc-status').innerText = (paidUntil > new Date()) ? 'Активен' : 'Истек';
            document.getElementById('acc-total-leads').innerText = myLeads.length;
            
            const currentTariff = TARIFFS['business']; 
            document.getElementById('acc-limit-text').innerText = `${myLeads.length} / ${currentTariff.limit}`;
            document.getElementById('acc-progress').style.width = Math.min((myLeads.length/currentTariff.limit)*100, 100) + '%';

            updateFilterCounts();
            renderLeads();
        }

        function setupAdminUI() {
            document.getElementById('acc-plan-name').innerText = 'Админ';
            document.getElementById('acc-status').innerText = 'Платформа';
            document.getElementById('acc-date').innerText = 'Бессрочно';
            document.getElementById('acc-total-leads').innerText = myLeads.length;
            document.getElementById('limit-label').innerText = 'Всего клиентов:';
            document.getElementById('acc-limit-text').innerText = myLeads.length;
            document.getElementById('acc-progress').style.width = '100%';

            updateFilterCounts();
            renderLeads();
        }

        function updateFilterCounts() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            const week = new Date(today); week.setDate(week.getDate() - 7);
            const month = new Date(today); month.setMonth(month.getMonth() - 1);

            let counts = { today: 0, yesterday: 0, week: 0, month: 0 };
            myLeads.forEach(lead => {
                const d = new Date(lead.created_at);
                if (d >= today) counts.today++;
                if (d >= yesterday && d < today) counts.yesterday++;
                if (d >= week) counts.week++;
                if (d >= month) counts.month++;
            });

            document.getElementById('filter-btn-today').innerText = `Сегодня (${counts.today})`;
            document.getElementById('filter-btn-yesterday').innerText = `Вчера (${counts.yesterday})`;
            document.getElementById('filter-btn-week').innerText = `За неделю (${counts.week})`;
            document.getElementById('filter-btn-month').innerText = `За месяц (${counts.month})`;
        }

        function renderLeads() {
            const list = document.getElementById('business-leads-list');
            list.innerHTML = '';
            
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            const week = new Date(today); week.setDate(week.getDate() - 7);
            const month = new Date(today); month.setMonth(month.getMonth() - 1);

            let filtered = myLeads.filter(lead => {
                if (filterStatus !== 'all' && lead.status !== filterStatus) return false;
                const d = new Date(lead.created_at);
                if (filterTime === 'today' && d < today) return false;
                if (filterTime === 'yesterday' && (d < yesterday || d >= today)) return false;
                if (filterTime === 'week' && d < week) return false;
                if (filterTime === 'month' && d < month) return false;
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="color:var(--hint); text-align:center; padding:20px;">Нет заявок</p>';
                return;
            }

            filtered.forEach(lead => {
                const el = document.createElement('div');
                el.className = 'lead-card';
                el.onclick = () => openLeadModal(lead.id);
                
                let statusColor = lead.status === 'new' ? '#eff6ff' : (lead.status === 'in_progress' ? '#fffbeb' : '#f0fdf4');
                let statusTextColor = lead.status === 'new' ? '#1d4ed8' : (lead.status === 'in_progress' ? '#b45309' : '#15803d');
                let statusText = lead.status === 'new' ? 'Новая' : (lead.status === 'in_progress' ? 'В работе' : 'Выполнено');

                el.innerHTML = `
                    <div class="lead-top">
                        <div class="lead-name">${lead.name || 'Без имени'}</div>
                        <div style="background:${statusColor}; color:${statusTextColor}; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:bold;">${statusText}</div>
                    </div>
                    <div class="lead-phone">📞 ${lead.phone || '—'}</div>
                    <div class="lead-service">${lead.service || 'Услуга не указана'}</div>
                `;
                list.appendChild(el);
            });
        }

        function setTimeFilter(time, btn) { filterTime = time; document.querySelectorAll('.filters .filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderLeads(); }
        function setStatusFilter(status, btn) { filterStatus = status; document.querySelectorAll('.status-tab').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderLeads(); }

        function renderPlans() {
            const container = document.getElementById('plans-container');
            container.innerHTML = '';
            Object.keys(TARIFFS).forEach(key => {
                const t = TARIFFS[key];
                const card = document.createElement('div');
                card.className = 'plan-card';
                card.onclick = () => openPlanModal(key);
                let yearHtml = t.year > 0 ? `<div class="price-year">${t.monthIfYear} ₽ <span>/ мес</span></div><div class="price-note">При оплате за год: <b>${t.year} ₽</b></div>` : `<div class="price-note" style="margin-top:8px;">Оплата по факту заявок</div>`;
                let priceHtml = key === 'result' ? `<div class="price-main">${t.month} ₽ <span>/ заявка</span></div>` : `<div class="price-main">${t.month} ₽ <span>/ мес</span></div>`;
                card.innerHTML = `<div class="plan-name">${t.name}</div>${priceHtml}${yearHtml}`;
                container.appendChild(card);
            });
        }

        function openPlanModal(key) {
            currentPlanKey = key;
            const t = TARIFFS[key];
            document.getElementById('modal-plan-name').innerText = t.name;
            
            const payButtons = document.getElementById('modal-pay-buttons');
            const connectBtn = document.getElementById('modal-connect-btn');
            const yearBlock = document.getElementById('modal-year-block');

            if (key === 'result') {
                document.getElementById('modal-price-main').innerText = `25 ₽ / заявка`;
                yearBlock.style.display = 'none'; payButtons.style.display = 'none'; connectBtn.style.display = 'flex';
            } else {
                document.getElementById('modal-price-main').innerText = `${t.month} ₽ / мес`;
                yearBlock.style.display = 'block';
                document.getElementById('modal-price-year').innerText = `${t.monthIfYear} ₽ / мес`;
                document.getElementById('modal-year-note').innerText = `При оплате за год: ${t.year} ₽`;
                payButtons.style.display = 'block'; connectBtn.style.display = 'none';
                document.getElementById('btn-month-price').innerText = t.month;
                document.getElementById('btn-year-price').innerText = t.year;
            }
            document.getElementById('modal-plan-features').innerHTML = t.features.map(f => `<li style="font-size:14px; margin-bottom:8px; display:flex; gap:8px;"><span style="color:var(--success); font-weight:bold;">✓</span> ${f}</li>`).join('');
            document.getElementById('planModal').style.display = 'flex';
        }

        function openLeadModal(id) {
            const lead = myLeads.find(l => l.id === id);
            if (!lead) return;
            document.getElementById('modal-lead-name').innerText = lead.name || 'Без имени';
            document.getElementById('modal-lead-phone').innerText = lead.phone || '—';
            document.getElementById('modal-lead-service').innerText = lead.service || 'Не указана';
            document.getElementById('modal-lead-problem').innerText = lead.problem || 'Нет описания';
            const cleanPhone = (lead.phone || '').replace(/\D/g, '');
            document.getElementById('modal-btn-call').href = `tel:${lead.phone || ''}`;
            document.getElementById('modal-btn-tg').href = cleanPhone.length > 5 ? `https://t.me/+${cleanPhone}` : '#';
            document.getElementById('leadModal').style.display = 'flex';
        }

        function openCancelModal() { document.getElementById('cancelModal').style.display = 'flex'; }
        function openSupportModal() { document.getElementById('supportModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function payPlan(period) {
            const t = TARIFFS[currentPlanKey];
            const user = tg.initDataUnsafe?.user;
            try {
                const res = await fetch('/api/create-payment', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: user.id, tariff: currentPlanKey, period: period })
                });
                const data = await res.json();
                if (data.ok && data.url) { tg.openLink(data.url); closeModal('planModal'); } 
                else alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
            } catch (e) { alert('Ошибка сети'); }
        }

        async function connectResultPlan() {
            const user = tg.initDataUnsafe?.user;
            try {
                const res = await fetch('/api/connect-result', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: user.id, name: user.first_name, manager_id: ADMIN_TELEGRAM_ID })
                });
                if (res.ok) { alert('Тариф подключен!'); closeModal('planModal'); } else alert('Ошибка');
            } catch (e) { alert('Ошибка сети'); }
        }

        function submitCancel() { alert('Отменено'); closeModal('cancelModal'); }
        
        async function sendSupport() {
            const text = document.getElementById('support-text').value;
            if(!text) return;
            await fetch('/api/support', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, user_id: tg.initDataUnsafe.user.id, name: tg.initDataUnsafe.user.first_name }) });
            alert('Отправлено!');
            closeModal('supportModal');
        }

        function goToCRM() { window.location.href = '/crm?auth_success=1&telegram_id=' + tg.initDataUnsafe.user.id; }
        
        // Запуск
        init();
    </script>
