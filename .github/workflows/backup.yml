name: Weekly Supabase Backup
on:
  schedule:
    - cron: '0 3 * * 0' # Каждое воскресенье в 03:00 UTC
  workflow_dispatch:     # Для ручного запуска

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Скачать бэкап базы
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Устанавливаем клиент PostgreSQL
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
          # Делаем дамп базы. Используем переменную окружения, чтобы избежать проблем с символами.
          pg_dump "$SUPABASE_DB_URL" > backup_$(date +%Y%m%d).sql
          
      - name: Сохранить файл в репозиторий
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автоматический бэкап базы"
          file_pattern: "backup_*.sql"
